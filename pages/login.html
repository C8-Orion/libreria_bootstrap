<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header>
        <nav>

        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Iniciar sesión como administrador</h2>
            <p>Esta página es solo para administradores autorizados</p>
            <form class="login-form" action=":/admin.html">
                <label for="email">Correo:</label>
                <input id="email" type="email" required placeholder="ejemplo@gmail.com">
                <div class="error-message" id="emailError">El correo electrónico no es válido</div>
                <label for="password">Contraseña:</label>
                <input id="password" type="password"  required >
                <div class="error-message" id="passwordError">La contraseña es incorrecta</div>

                <div class="error-message" id="formError">Los datos son incorrectos</div>

                <button class="btn btn-primary">Ingresar al sistema</button>



            </form>
        </section>

    </main>

    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
