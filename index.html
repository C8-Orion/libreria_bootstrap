<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="/libreria_bootstrap/css/base.css">
<link rel="stylesheet" href="/libreria_bootstrap/css/componentes.css">
<link rel="stylesheet" href="/libreria_bootstrap/css/estilos.css">

<body>
  <header>

    <nav class="navbar navbar-expand-lg navbar-biblioweb sticky-top py-2" aria-label="Principal">
      <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span class="d-flex flex-column lh-1">
            <span class="fw-bold">BiblioWeb</span>
            <small class="text-uppercase">Biblioteca cívica &amp; archivo</small>
          </span>
        </a>

        <!-- Botón hamburguesa (móvil) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Enlaces + acciones -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Catálogo de libros</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Horarios &amp; contacto</a></li>
          </ul>

          <div class="d-flex align-items-center gap-2">
            <button type="button" id="btnTema" class="btn btn-sm btn-outline-secondary" aria-label="Cambiar tema">
              <i class="bi bi-sun" aria-hidden="true"></i>
            </button>
            <a href="#" class="btn btn-sm btn-outline-secondary">
              <i class="bi bi-shield-lock" aria-hidden="true"></i> Acceso Admin
            </a>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle" aria-label="Mi cuenta">
              <i class="bi bi-person" aria-hidden="true"></i>
            </button>
          </div>
        </div>

      </div>
    </nav>

    <!-- Franja de aviso -->
    <div class="franja-aviso py-1">
      <div class="container d-md-flex justify-content-between align-items-center small">

        <div class="d-flex align-items-center gap-3">
          <span class="badge badge-biblioweb text-uppercase">Red pública libre</span>
          <span>Abierto hoy: 08:30 – 20:30 h</span>
          <span class="d-none d-md-flex">Claustro Central y Sala de investigadores en régimen de libre consulta</span>
        </div>

        <div class="d-none d-md-flex gap-3">
          <a href="#" class="text-decoration-none">Catálogo OPAC en línea</a>
          <a href="#" class="text-decoration-none">Cómo llegar</a>
        </div>

      </div>
    </div>

  </header>



</body>

</html>
