<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BiblioWeb - Panel de Administración</title>
    <!-- Bootstrap 5.3 CSS por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Hoja de Estilos Institucional -->
    <link href="../css/base.css" rel="stylesheet" />
    <link href="../css/componentes.css" rel="stylesheet" />
    <link href="../css/estilos.css" rel="stylesheet" />
    <!-- Tema claro/oscuro (en el head para evitar parpadeo) -->
    <script src="../js/tema.js"></script>
</head>

<body>
    <header>
        <!-- ==================== BARRA DE NAVEGACIÓN ==================== -->
        <nav class="navbar navbar-expand-lg navbar-dark navbar-biblioweb sticky-top py-2">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white fs-4" href="admin.html">
                    <svg fill="none" height="28" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="28">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    BiblioWeb · Admin
                </a>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <button class="btn btn-outline-light rounded-circle p-2 lh-1" id="theme-toggle"
                        style="width: 38px; height: 38px;" title="Alternar tema">
                        ☀️
                    </button>
                    <!-- Botón de Cerrar Sesión requerido -->
                    <button class="btn btn-terracota btn-sm px-3" id="btn-logout">
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </nav>
    </header>
    <main class="container my-5">
        <!-- ==================== CABECERA DEL PANEL ==================== -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="font-serif fw-bold display-6 mb-1">Consola Central de Administración</h1>
                <p class="text-secondary mb-0">Gestión de acervo bibliográfico, inventario y solicitudes ciudadanas.</p>
            </div>
            <div class="badge bg-success-subtle text-success fs-6 px-3 py-2 border">
                ● Sesión Activa: admin@biblioweb.test
            </div>
        </div>

        <!-- ==================== FORMULARIO DE GESTIÓN DE LIBROS ==================== -->
        <section class="card card-biblioweb p-4 mb-5">
            <h4 class="font-serif fw-bold text-primary mb-3">Registrar o Editar Libro</h4>
            <p class="text-secondary small mb-4">Ingresa los datos del volumen para la catalogación oficial.</p>
            <form id="form-libro"
                onsubmit="event.preventDefault(); alert('Acción estática: Formulario completado correctamente.');">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" for="titulo">Título de la Obra *</label>
                        <input class="form-control" id="titulo" placeholder="Ej. Ficciones" required="" type="text" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" for="autor">Autor / Creador *</label>
                        <input class="form-control" id="autor" placeholder="Ej. Jorge Luis Borges" required=""
                            type="text" />
                    </div>
                    <div class="col-md-8">
                        <label class="form-label small fw-bold" for="portada">URL de Portada Digital</label>
                        <input class="form-control" id="portada" placeholder="https://images.unsplash.com/..."
                            type="url" />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold" for="categoria">Categoría Temática *</label>
                        <select class="form-select" id="categoria" required="">
                            <option disabled="" selected="" value="">Seleccionar...</option>
                            <option value="Narrativa">Narrativa</option>
                            <option value="Tecnología">Tecnología</option>
                            <option value="Ciencia">Ciencia</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold" for="descripcion">Descripción / Sinopsis</label>
                        <textarea class="form-control" id="descripcion"
                            placeholder="Resumen descriptivo del ejemplar..." rows="3"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                        <button class="btn btn-outline-secondary" type="reset">Cancelar</button>
                        <button class="btn btn-verde px-4" type="submit">Guardar</button>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
