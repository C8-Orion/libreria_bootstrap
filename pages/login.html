<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/componentes.css">
    <link rel="stylesheet" href="../css/base.css">
</head>

<body>

    <header>
        <nav>

        </nav>
    </header>

    <main>

        <section class="form-container p-1">
            <div class="row">
                <div class="col-12 col-md-12 col-lg-12 p-3 p-sm-5">
                    <h2>Iniciar sesión como administrador</h2>
                    <p>Esta página es solo para administradores autorizados</p>
                    <form id="login-form" class="login-form p-2 gap-2">
                        <label for="email">Correo:</label>
                        <input id="email" type="email" class="form-control" required placeholder="ejemplo@gmail.com">

                        <label for="password">Contraseña:</label>
                        <input id="password" type="password" class="form-control" required>
                        <span class="error-message" id="passwordError"></span>

                        <span class="error-message" id="formError">Los datos son incorrectos</span>
                        <button class="btn btn-primary" id="btnSubmit">Ingresar al sistema</button>
                    </form>
                </div>
            </div>

        </section>

    </main>

    <footer>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
